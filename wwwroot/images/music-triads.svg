<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title">
  <title id="title">Triad chord tones: root, third, fifth</title><rect width="960" height="360" rx="28" fill="#fcecf1"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#853b5b"><text x="480" y="65" font-size="29" font-weight="bold">Build a triad by stacking every other scale tone</text></g>
  <g stroke="#9d5874" stroke-width="3"><path d="M260 125H700M260 165H700M260 205H700M260 245H700M260 285H700"/></g>
  <g fill="#b84e78"><ellipse cx="355" cy="245" rx="19" ry="12" transform="rotate(-18 355 245)"/><ellipse cx="480" cy="205" rx="19" ry="12" transform="rotate(-18 480 205)"/><ellipse cx="605" cy="165" rx="19" ry="12" transform="rotate(-18 605 165)"/></g>
  <g font-family="Arial,sans-serif" font-size="21" fill="#853b5b"><text x="720" y="252">Root</text><text x="720" y="212">Third</text><text x="720" y="172">Fifth</text></g>
</svg>
