<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title">
  <title id="title">Harmonic progression from tonic through predominant and dominant back to tonic</title>
  <rect width="960" height="360" rx="28" fill="#f3edff"/>
  <text x="480" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#573b88">A common harmonic journey</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="75" y="130" width="170" height="105" rx="18" fill="#d9cafa"/><text x="160" y="175" font-size="27" fill="#38285f">I</text><text x="160" y="210" font-size="18" fill="#38285f">Tonic · rest</text>
    <rect x="295" y="130" width="170" height="105" rx="18" fill="#e5dafa"/><text x="380" y="175" font-size="27" fill="#38285f">IV</text><text x="380" y="210" font-size="18" fill="#38285f">Prepare</text>
    <rect x="515" y="130" width="170" height="105" rx="18" fill="#ead3e3"/><text x="600" y="175" font-size="27" fill="#38285f">V</text><text x="600" y="210" font-size="18" fill="#38285f">Dominant · tension</text>
    <rect x="735" y="130" width="150" height="105" rx="18" fill="#d9cafa"/><text x="810" y="175" font-size="27" fill="#38285f">I</text><text x="810" y="210" font-size="18" fill="#38285f">Resolve</text>
  </g>
  <g stroke="#7957ae" stroke-width="5" fill="none"><path d="M245 182H285M465 182H505M685 182H725"/></g>
  <text x="480" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#573b88">In C major: C – F – G – C</text>
</svg>
