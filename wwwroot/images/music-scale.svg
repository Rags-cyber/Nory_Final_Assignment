<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title">
  <title id="title">Major scale whole-step and half-step pattern</title><rect width="960" height="360" rx="28" fill="#fff3e4"/>
  <text x="480" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#9a5424">Major scale: W – W – H – W – W – W – H</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#733d27">
    <g font-size="24" font-weight="bold"><text x="95" y="165">C</text><text x="205" y="165">D</text><text x="315" y="165">E</text><text x="425" y="165">F</text><text x="535" y="165">G</text><text x="645" y="165">A</text><text x="755" y="165">B</text><text x="865" y="165">C</text></g>
    <g stroke="#d7863b" stroke-width="5"><path d="M95 195H205M205 195H315M315 195H425M425 195H535M535 195H645M645 195H755M755 195H865"/></g>
    <g font-size="18"><text x="150" y="235">W</text><text x="260" y="235">W</text><text x="370" y="235">H</text><text x="480" y="235">W</text><text x="590" y="235">W</text><text x="700" y="235">W</text><text x="810" y="235">H</text></g>
    <text x="480" y="305" font-size="20">W = whole step · H = half step</text>
  </g>
</svg>
